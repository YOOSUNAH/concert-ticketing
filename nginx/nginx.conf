worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # --- Rate Limit Zones ---
    limit_req_zone $binary_remote_addr zone=seats:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=concerts:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=queue:10m rate=2r/s;

    # --- Proxy Cache ---
    proxy_cache_path /var/cache/nginx/seats levels=1:2 keys_zone=seats_cache:10m max_size=100m inactive=10s;

    upstream main-api {
        server concert-ticket-api-1:8080 max_fails=2 fail_timeout=5s;
        server concert-ticket-api-2:8080 max_fails=2 fail_timeout=5s;
    }

    upstream concert-api {
        server concert-api:8082;
    }

    upstream queue-api {
        server concert-ticket-queue-api-1:8081 max_fails=2 fail_timeout=5s;
        server concert-ticket-queue-api-2:8081 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        # --- 좌석 조회: rate limit + 프록시 캐시 (가장 많이 호출되는 엔드포인트) ---
        location ~ ^/schedules/\d+/seats$ {
            limit_req zone=seats burst=5 nodelay;

            proxy_cache seats_cache;
            proxy_cache_valid 200 3s;
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "max-age=3";

            proxy_pass http://main-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- 공연 조회: rate limit ---
        location /concerts/ {
            limit_req zone=concerts burst=10 nodelay;

            proxy_pass http://concert-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # /concerts 정확히 매칭 (trailing slash 없는 경우)
        location = /concerts {
            limit_req zone=concerts burst=10 nodelay;

            proxy_pass http://concert-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- 대기열: rate limit (매진 후 재시도 폭격 방어) ---
        location /queue/ {
            limit_req zone=queue burst=3 nodelay;

            proxy_pass http://queue-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- 나머지 (예매/결제/인증): 큐가 보호하므로 rate limit 없음 ---
        location / {
            proxy_pass http://main-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
