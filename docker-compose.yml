services:
  nginx:
    image: nginx:latest
    container_name: concert-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - concert-api
      - queue-api
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: concert-postgres
    environment:
      POSTGRES_DB: concert
      POSTGRES_USER: concert
      POSTGRES_PASSWORD: concert
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis-master:
    image: redis:7
    container_name: concert-redis-master
    command: redis-server --appendonly yes --appendfsync everysec --min-replicas-to-write 1
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data

  redis-replica:
    image: redis:7
    container_name: concert-redis-replica
    command: redis-server --appendonly yes --appendfsync everysec --replicaof redis-master 6379
    depends_on:
      - redis-master
    volumes:
      - redis-replica-data:/data

  redis-sentinel-1:
    image: redis:7
    container_name: concert-redis-sentinel-1
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica

  redis-sentinel-2:
    image: redis:7
    container_name: concert-redis-sentinel-2
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica

  redis-sentinel-3:
    image: redis:7
    container_name: concert-redis-sentinel-3
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica

  mongo:
    image: mongo:7
    container_name: concert-mongo
    environment:
      MONGO_INITDB_DATABASE: concert
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/concert
      SPRING_DATASOURCE_USERNAME: concert
      SPRING_DATASOURCE_PASSWORD: concert
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      SPRING_MONGODB_URI: mongodb://mongo:27017/concert
    expose:
      - "8080"
    depends_on:
      - postgres
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
      - mongo
    restart: unless-stopped
    deploy:
      replicas: 2

  concert-api:
    build:
      context: .
      dockerfile: concert-api/Dockerfile
    container_name: concert-concert-api
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/concert
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    expose:
      - "8082"
    depends_on:
      - mongo
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
    restart: unless-stopped

  queue-api:
    build:
      context: .
      dockerfile: queue-api/Dockerfile
    environment:
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    expose:
      - "8081"
    depends_on:
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
    restart: unless-stopped
    deploy:
      replicas: 2

  queue-worker:
    build:
      context: .
      dockerfile: queue-worker/Dockerfile
    environment:
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    depends_on:
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
    restart: always
    deploy:
      replicas: 2

volumes:
  postgres-data:
  redis-master-data:
  redis-replica-data:
  mongo-data:
