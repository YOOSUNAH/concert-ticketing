services:
  postgres:
    image: postgres:16
    container_name: concert-postgres
    environment:
      POSTGRES_DB: concert
      POSTGRES_USER: concert
      POSTGRES_PASSWORD: concert
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: concert-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
