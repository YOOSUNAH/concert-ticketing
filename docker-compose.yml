services:
  nginx:
    image: nginx:latest
    container_name: concert-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - concert-api
      - queue-api
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: concert-postgres
    environment:
      POSTGRES_DB: concert
      POSTGRES_USER: concert
      POSTGRES_PASSWORD: concert
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis-master:
    image: redis:7
    container_name: concert-redis-master
    command: redis-server --appendonly yes --appendfsync everysec --min-replicas-to-write 1
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data

  redis-replica:
    image: redis:7
    container_name: concert-redis-replica
    command: redis-server --appendonly yes --appendfsync everysec --replicaof redis-master 6379
    depends_on:
      - redis-master
    volumes:
      - redis-replica-data:/data

  redis-sentinel-1:
    image: redis:7
    container_name: concert-redis-sentinel-1
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica

  redis-sentinel-2:
    image: redis:7
    container_name: concert-redis-sentinel-2
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica

  redis-sentinel-3:
    image: redis:7
    container_name: concert-redis-sentinel-3
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica

  mongo:
    image: mongo:7
    container_name: concert-mongo
    environment:
      MONGO_INITDB_DATABASE: concert
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Kafka 단일 브로커 (KRaft 모드 — Zookeeper 불필요).
  # 리스너 2개: 컨테이너 내부 서비스는 kafka:9092(INTERNAL), 호스트(IDE/로컬)는 localhost:9092(EXTERNAL).
  kafka:
    image: apache/kafka:3.9.0
    container_name: concert-kafka
    ports:
      - "9092:29092" # 호스트 localhost:9092 → 컨테이너 EXTERNAL 리스너(29092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 단일 브로커이므로 내부 토픽 복제 계수를 1로 (기본 3이면 부팅 실패)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # Kafka 토픽/메시지/컨슈머랙 모니터링 UI (발표 데모용). http://localhost:8090
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: concert-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: concert
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/concert
      SPRING_DATASOURCE_USERNAME: concert
      SPRING_DATASOURCE_PASSWORD: concert
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    expose:
      - "8080"
    depends_on:
      - postgres
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
      - kafka
    restart: unless-stopped
    deploy:
      replicas: 2

  admin-api:
    build:
      context: .
      dockerfile: Dockerfile.admin-api
    container_name: concert-admin-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/concert
      SPRING_DATASOURCE_USERNAME: concert
      SPRING_DATASOURCE_PASSWORD: concert
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      SPRING_MONGODB_URI: mongodb://mongo:27017/concert
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - mongo
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
    restart: unless-stopped

  concert-api:
    build:
      context: .
      dockerfile: Dockerfile.concert-api
    container_name: concert-concert-api
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/concert
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    expose:
      - "8082"
    depends_on:
      - mongo
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
    restart: unless-stopped

  queue-api:
    build:
      context: .
      dockerfile: Dockerfile.queue-api
    environment:
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    expose:
      - "8081"
    depends_on:
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
    restart: unless-stopped
    deploy:
      replicas: 2

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile.queue-worker
    environment:
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    depends_on:
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
    restart: always
    deploy:
      replicas: 2

volumes:
  postgres-data:
  redis-master-data:
  redis-replica-data:
  mongo-data:
  kafka-data:
