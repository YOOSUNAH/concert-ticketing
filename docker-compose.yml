services:
  postgres:
    image: postgres:16
    container_name: concert-postgres
    environment:
      POSTGRES_DB: concert
      POSTGRES_USER: concert
      POSTGRES_PASSWORD: concert
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: concert-redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mongo:
    image: mongo:7
    container_name: concert-mongo
    environment:
      MONGO_INITDB_DATABASE: concert
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: concert-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/concert
      SPRING_DATASOURCE_USERNAME: concert
      SPRING_DATASOURCE_PASSWORD: concert
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  queue-api:
    build:
      context: .
      dockerfile: queue-api/Dockerfile
    container_name: concert-queue-api
    environment:
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped

  queue-worker:
    build:
      context: .
      dockerfile: queue-worker/Dockerfile
    container_name: concert-queue-worker
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - redis
    restart: always

volumes:
  postgres-data:
  redis-data:
  mongo-data:
