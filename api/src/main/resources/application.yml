spring:
  application:
    name: concert-ticketing

  datasource:
    url: jdbc:postgresql://localhost:5432/concert
    username: concert
    password: concert
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: concert-ticketing-jwt-secret-key-for-development-only-must-be-256-bits
  validity-seconds: 3600

logging:
  file:
    name: app.log
  level:
    com.concertticketing.auth: DEBUG
